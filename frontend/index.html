<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#9ec59c"/>
<title>Nokify</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0f0c;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(40,80,40,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(20,60,20,0.12) 0%, transparent 60%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    padding: 24px 16px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.13) 3px, rgba(0,0,0,0.13) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ── Phone Shell ─────────────────────────────── */
  .phone {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(175deg, #2e322e 0%, #1a1d1a 55%, #161916 100%);
    border-radius: 36px 36px 44px 44px;
    padding: 0 0 32px 0;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.06) inset,
      0 -2px 0 rgba(0,0,0,0.5) inset,
      2px 0 0 rgba(255,255,255,0.04) inset,
      0 28px 80px rgba(0,0,0,0.85),
      0 6px 20px rgba(0,0,0,0.6);
    border: 1.5px solid #111;
  }

  /* ── Speaker ─────────────────────────────────── */
  .speaker-grille { display: flex; justify-content: center; padding: 18px 0 10px; }
  .grille-bar {
    width: 60px; height: 6px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, #111 0px, #111 2px, #1e221e 2px, #1e221e 4px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  /* ── Brand Bar ───────────────────────────────── */
  .brand-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 24px 12px; }
  .brand-name {
    font-family: 'VT323', monospace; font-size: 22px; letter-spacing: 4px;
    color: #5a7a5a; text-shadow: 0 0 8px rgba(90,122,90,0.4);
  }
  .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .signal-bars span { width: 3px; border-radius: 1px; }
  .signal-bars span:nth-child(1) { height: 4px;  background: #5a8a5a; }
  .signal-bars span:nth-child(2) { height: 7px;  background: #5a8a5a; }
  .signal-bars span:nth-child(3) { height: 10px; background: #5a8a5a; }
  .signal-bars span:nth-child(4) { height: 13px; background: #3a5a3a; }

  /* ── LCD Screen ──────────────────────────────── */
  .lcd-wrap {
    margin: 0 16px;
    border-radius: 6px;
    padding: 3px;
    background: #0f1a0f;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 -1px 2px rgba(255,255,255,0.03), 0 1px 0 rgba(255,255,255,0.05);
  }
  .lcd {
    position: relative;
    background: #9ec59c;
    border-radius: 4px;
    min-height: 280px;
    padding: 16px 14px;
    overflow: hidden;
    font-family: 'VT323', monospace;
    color: #0f1d10;
  }
  .lcd::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,29,16,0.06) 0.5px, transparent 0.6px);
    background-size: 3px 3px;
    pointer-events: none; z-index: 1;
  }
  .lcd::after {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(0,0,0,0.04) 5px, rgba(0,0,0,0.04) 6px);
    pointer-events: none; z-index: 1;
  }
  .lcd > * { position: relative; z-index: 2; }

  /* ── LCD Type ────────────────────────────────── */
  .lcd-title { font-size: 28px; line-height: 1; margin-bottom: 6px; letter-spacing: 1px; }
  .lcd-sub   { font-size: 17px; opacity: 0.7; margin-bottom: 14px; line-height: 1.2; }
  .lcd-log   { font-size: 16px; line-height: 1.5; opacity: 0.8; }
  .lcd-log .err { color: #5a0a0a; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor::after { content:'_'; animation: blink 1.1s steps(2,start) infinite; }

  /* ── Drop Zone ───────────────────────────────── */
  .drop-zone {
    border: 2px dashed rgba(15,29,16,0.35); border-radius: 4px;
    padding: 18px 12px; text-align: center; cursor: pointer;
    transition: background 0.15s, border-color 0.15s; margin-top: 8px;
  }
  .drop-zone.drag-over { background: rgba(15,29,16,0.08); border-color: rgba(15,29,16,0.6); }
  .drop-zone .glyph { font-size: 36px; display: block; margin-bottom: 6px; line-height: 1; }
  .drop-zone .hint  { font-size: 17px; line-height: 1.4; }
  .drop-zone input[type=file] { display: none; }

  /* ── YouTube Entry ───────────────────────────── */
  .yt-divider {
    display: flex; align-items: center; gap: 6px;
    margin: 10px 0 8px; opacity: 0.5; font-size: 13px;
  }
  .yt-divider::before, .yt-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(15,29,16,0.3);
  }

  /* ── Search Input ────────────────────────────── */
  .nokia-input-wrap { margin: 8px 0 6px; }
  .nokia-input {
    width: 100%;
    background: rgba(15,29,16,0.08);
    border: none;
    border-bottom: 2px solid rgba(15,29,16,0.45);
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: #0f1d10;
    padding: 4px 2px 2px;
    outline: none;
    caret-color: #0f1d10;
  }
  .nokia-input::placeholder { color: rgba(15,29,16,0.35); }

  /* ── Results List ────────────────────────────── */
  .results-list {
    max-height: 162px;
    overflow-y: auto;
    margin-top: 6px;
    border-top: 1px solid rgba(15,29,16,0.2);
  }
  .results-list::-webkit-scrollbar { width: 3px; }
  .results-list::-webkit-scrollbar-thumb { background: rgba(15,29,16,0.3); border-radius: 2px; }
  .result-item {
    display: flex; align-items: baseline; gap: 5px;
    padding: 5px 2px; border-bottom: 1px solid rgba(15,29,16,0.1);
    cursor: pointer; font-size: 15px; line-height: 1.25;
    transition: background 0.1s;
  }
  .result-item:hover  { background: rgba(15,29,16,0.09); }
  .result-item:active { background: rgba(15,29,16,0.16); }
  .result-num    { font-size: 13px; opacity: 0.45; min-width: 14px; flex-shrink: 0; }
  .result-title  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-ch     { font-size: 12px; opacity: 0.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .result-dur    { font-size: 13px; opacity: 0.6; white-space: nowrap; flex-shrink: 0; }

  /* ── Progress ────────────────────────────────── */
  .progress-track { height: 8px; background: rgba(15,29,16,0.2); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress-fill  { height: 100%; background: #0f1d10; border-radius: 4px; transition: width 0.4s ease; }
  @keyframes progress-pulse {
    0%{width:12%} 25%{width:38%} 55%{width:65%} 80%{width:82%} 100%{width:91%}
  }
  .progress-fill.animating { animation: progress-pulse 5s ease-out forwards; }

  /* ── Timeline ────────────────────────────────── */
  .timeline-wrap { margin: 10px 0; }
  .timeline-label { font-size: 15px; opacity: 0.7; margin-bottom: 4px; }
  .timeline-track { position: relative; height: 18px; background: rgba(15,29,16,0.15); border-radius: 3px; overflow: hidden; }
  .timeline-hook  { position: absolute; top: 0; bottom: 0; background: rgba(15,29,16,0.45); border-radius: 2px; }
  .timeline-timestamps { display: flex; justify-content: space-between; font-size: 14px; opacity: 0.65; margin-top: 3px; }

  /* ── Meta Grid ───────────────────────────────── */
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 10px 0; }
  .meta-cell { background: rgba(15,29,16,0.1); border-radius: 3px; padding: 5px 6px; text-align: center; }
  .meta-cell .val { font-size: 20px; display: block; line-height: 1; }
  .meta-cell .lbl { font-size: 13px; opacity: 0.6; display: block; }

  /* ── Mode Toggle ─────────────────────────────── */
  .mode-toggle { display: flex; border: 1.5px solid rgba(15,29,16,0.35); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .mode-btn { flex: 1; padding: 6px 0; font-family: 'VT323', monospace; font-size: 18px; background: transparent; border: none; cursor: pointer; color: #0f1d10; opacity: 0.5; transition: opacity 0.12s, background 0.12s; }
  .mode-btn.active { background: rgba(15,29,16,0.18); opacity: 1; }

  /* ── Buttons ─────────────────────────────────── */
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .key-btn {
    flex: 1; font-family: 'VT323', monospace; font-size: 19px; letter-spacing: 1px;
    padding: 7px 6px 5px;
    background: linear-gradient(180deg, rgba(15,29,16,0.12) 0%, rgba(15,29,16,0.22) 100%);
    border: 1.5px solid rgba(15,29,16,0.4); border-radius: 4px;
    color: #0f1d10; cursor: pointer;
    box-shadow: 0 3px 0 rgba(15,29,16,0.25);
    transition: box-shadow 0.08s, transform 0.08s;
    user-select: none; text-align: center; text-decoration: none; display: block;
  }
  .key-btn:active { box-shadow: 0 0 0 rgba(15,29,16,0.25); transform: translateY(3px); }
  .key-btn.primary { background: linear-gradient(180deg, rgba(15,29,16,0.22) 0%, rgba(15,29,16,0.38) 100%); }
  .key-btn:disabled { opacity: 0.45; cursor: default; }

  audio {
    width: 100%; height: 28px; margin: 8px 0;
    filter: sepia(1) hue-rotate(80deg) brightness(0.6) contrast(1.4);
  }
  .done-header { font-size: 38px; letter-spacing: 2px; margin-bottom: 4px; }

  /* ── Keypad ──────────────────────────────────── */
  .keypad-area { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px; }
  .nav-row { display: flex; gap: 6px; justify-content: center; }
  .nav-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(145deg, #252825, #1a1d1a);
    border: 1px solid #111;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace; font-size: 16px; color: #5a8a5a;
    cursor: default; user-select: none;
  }
  .nav-center {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(145deg, #2a302a, #1c201c);
    border: 1px solid #111;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace; font-size: 14px; color: #4a6a4a;
    cursor: default; user-select: none;
  }
  .digit-rows { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
  .digit-key {
    border-radius: 6px;
    background: linear-gradient(175deg, #252825, #1c1f1c);
    border: 1px solid #0f110f;
    box-shadow: 0 3px 0 #0a0c0a, inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 6px 0 4px; text-align: center;
    font-family: 'VT323', monospace; color: #8ab08a;
    cursor: default; user-select: none;
  }
  .digit-key .d { font-size: 20px; line-height: 1; }
  .digit-key .l { font-size: 9px; letter-spacing: 1px; color: #4a6a4a; }
  .softkeys { display: flex; justify-content: space-between; align-items: center; padding: 20px 28px 0; }
  .softkey-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px;
    color: #3a5a3a; text-transform: uppercase;
    background: rgba(255,255,255,0.03); border-radius: 20px;
    padding: 4px 12px; border: 1px solid rgba(255,255,255,0.04);
  }
  .phone-bottom-line {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, transparent, #2a4a2a, transparent);
    border-radius: 2px; margin: 20px auto 0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

function getApiBase() {
  return new URLSearchParams(location.search).get('api') || 'http://localhost:5000';
}
const API = getApiBase();

function fmtTime(s) {
  if (!s && s !== 0) return '?:??';
  const m = Math.floor(s / 60);
  return `${m}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
}

function truncate(str, n) {
  return str && str.length > n ? str.slice(0, n - 2) + '..' : (str || '');
}

function Log({ lines }) {
  return (
    <div className="lcd-log">
      {lines.map((l, i) => (
        <div key={i} className={l.err ? 'err' : ''}>
          {l.text}{i === lines.length - 1 ? <span className="cursor"/> : null}
        </div>
      ))}
    </div>
  );
}

// ── Shell ─────────────────────────────────────────────────────────────────────
function PhoneShell({ children }) {
  return (
    <div className="phone">
      <div className="speaker-grille"><div className="grille-bar"/></div>
      <div className="brand-bar">
        <span className="brand-name">NOKIFY</span>
        <div className="signal-bars"><span/><span/><span/><span/></div>
      </div>
      <div className="lcd-wrap">
        <div className="lcd">{children}</div>
      </div>
      <div className="keypad-area">
        <div className="nav-row">
          <div className="nav-btn">&#9650;</div>
          <div className="nav-center">OK</div>
          <div className="nav-btn">&#9654;</div>
        </div>
        <div className="digit-rows">
          {[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],
            ['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']
          ].map(([d,l]) => (
            <div className="digit-key" key={d+l}>
              <div className="d">{d}</div>
              {l && <div className="l">{l}</div>}
            </div>
          ))}
        </div>
      </div>
      <div className="softkeys">
        <span className="softkey-label">Menu</span>
        <span className="softkey-label">Names</span>
      </div>
      <div className="phone-bottom-line"/>
    </div>
  );
}

// ── Stage: idle ───────────────────────────────────────────────────────────────
function IdleStage({ onFile, onSearch }) {
  const inputRef = useRef();
  const [drag, setDrag] = useState(false);

  const handleDrop = useCallback(e => {
    e.preventDefault(); setDrag(false);
    const file = e.dataTransfer.files[0];
    if (file) onFile(file);
  }, [onFile]);

  return (
    <>
      <div className="lcd-title">NOKIFY</div>
      <div className="lcd-sub">song to ringtone</div>
      <div
        className={`drop-zone${drag ? ' drag-over' : ''}`}
        onClick={() => inputRef.current.click()}
        onDragOver={e => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={handleDrop}
      >
        <input ref={inputRef} type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac"
          onChange={e => e.target.files[0] && onFile(e.target.files[0])}/>
        <span className="glyph">&#9835;</span>
        <span className="hint">tap or drop an mp3</span>
      </div>

      <div className="yt-divider">or</div>

      <button className="key-btn primary" onClick={onSearch}
        style={{fontSize:17, letterSpacing:2}}>
        &#9654; search youtube
      </button>

      <div className="lcd-log" style={{marginTop:10}}>
        <div>open-source ai</div>
        <div>librosa + scipy</div>
        <div className="cursor">no upload kept</div>
      </div>
    </>
  );
}

// ── Stage: search youtube ─────────────────────────────────────────────────────
function SearchStage({ onBack, onImported }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importTitle, setImportTitle] = useState('');
  const [logs, setLogs] = useState([{text: 'type a song name_'}]);
  const [importLogs, setImportLogs] = useState([]);
  const inputRef = useRef();

  useEffect(() => { inputRef.current?.focus(); }, []);

  const doSearch = async () => {
    const q = query.trim();
    if (!q) return;
    setSearching(true);
    setResults([]);
    setLogs([{text: `searching: ${q}...`}]);
    try {
      const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Search failed');
      setResults(data.results);
      setLogs([{text: `${data.results.length} results found`}]);
    } catch(e) {
      setLogs([{text: e.message, err: true}]);
    } finally {
      setSearching(false);
    }
  };

  const doImport = async (result) => {
    setImporting(true);
    setImportTitle(result.title);
    const addLog = (text, err=false) =>
      setImportLogs(p => [...p, {text, err}]);

    setImportLogs([{text: 'connecting to youtube...'}]);
    const t1 = setTimeout(() => addLog('downloading audio stream...'), 2000);
    const t2 = setTimeout(() => addLog('decoding audio...'), 6000);
    const t3 = setTimeout(() => addLog('computing chroma features...'), 10000);
    const t4 = setTimeout(() => addLog('detecting hook...'), 14000);

    try {
      const r = await fetch(`${API}/api/import`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url: result.url}),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Import failed');
      [t1,t2,t3,t4].forEach(clearTimeout);
      addLog('nokia-ify preview...');
      setTimeout(() => onImported(data), 300);
    } catch(e) {
      [t1,t2,t3,t4].forEach(clearTimeout);
      addLog(e.message, true);
      setTimeout(() => setImporting(false), 2000);
    }
  };

  // Importing sub-view
  if (importing) {
    return (
      <>
        <div className="lcd-title">IMPORTING</div>
        <div className="lcd-sub" style={{fontSize:14, wordBreak:'break-all'}}>
          {truncate(importTitle, 32)}
        </div>
        <div className="progress-track">
          <div className="progress-fill animating"/>
        </div>
        <Log lines={importLogs}/>
      </>
    );
  }

  return (
    <>
      <div className="lcd-title">YOUTUBE</div>

      <div className="nokia-input-wrap">
        <input
          ref={inputRef}
          className="nokia-input"
          type="text"
          value={query}
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && doSearch()}
          placeholder="song name or artist..."
          spellCheck={false}
          autoComplete="off"
        />
      </div>

      <div className="btn-row" style={{marginBottom: results.length ? 0 : 8}}>
        <button className="key-btn" onClick={onBack}>Back</button>
        <button className="key-btn primary" onClick={doSearch} disabled={searching}>
          {searching ? 'Wait...' : 'Find'}
        </button>
      </div>

      {results.length === 0 && !searching && <Log lines={logs}/>}

      {results.length > 0 && (
        <div className="results-list">
          {results.map((r, i) => (
            <div key={r.id} className="result-item" onClick={() => doImport(r)}>
              <span className="result-num">{i + 1}.</span>
              <span className="result-title">{truncate(r.title, 26)}</span>
              {r.uploader && <span className="result-ch">{truncate(r.uploader, 12)}</span>}
              <span className="result-dur">{fmtTime(r.duration)}</span>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ── Stage: analyzing / uploading ──────────────────────────────────────────────
function AnalyzingStage({ label, sublabel, logs }) {
  return (
    <>
      <div className="lcd-title">{label}</div>
      <div className="lcd-sub" style={{fontSize:14, wordBreak:'break-all'}}>{sublabel}</div>
      <div className="progress-track">
        <div className="progress-fill animating"/>
      </div>
      <Log lines={logs}/>
    </>
  );
}

// ── Stage: review ─────────────────────────────────────────────────────────────
function ReviewStage({ result, mode, onModeChange, onRetry, onSave }) {
  const hookPct = (result.hook_start / result.duration) * 100;
  const hookW   = ((result.hook_end - result.hook_start) / result.duration) * 100;
  return (
    <>
      <div className="lcd-title">HOOK FOUND</div>
      {result.title && (
        <div className="lcd-sub" style={{fontSize:13}}>{truncate(result.title, 34)}</div>
      )}
      <div className="timeline-wrap">
        <div className="timeline-label">track timeline</div>
        <div className="timeline-track">
          <div className="timeline-hook" style={{left: hookPct+'%', width: hookW+'%'}}/>
        </div>
        <div className="timeline-timestamps">
          <span>{fmtTime(result.hook_start)} &#8594; {fmtTime(result.hook_end)}</span>
          <span>{fmtTime(result.duration)}</span>
        </div>
      </div>
      <audio controls src={API + result.preview_url}/>
      <div className="meta-grid">
        <div className="meta-cell">
          <span className="val">{fmtTime(result.duration)}</span>
          <span className="lbl">length</span>
        </div>
        <div className="meta-cell">
          <span className="val">{Math.round(result.hook_length)}s</span>
          <span className="lbl">hook</span>
        </div>
        <div className="meta-cell">
          <span className="val">{Math.round(result.confidence * 100)}%</span>
          <span className="lbl">conf</span>
        </div>
      </div>
      <div className="mode-toggle">
        <button className={`mode-btn${mode==='ringtone'?' active':''}`} onClick={() => onModeChange('ringtone')}>
          Ringtone (~20s)
        </button>
        <button className={`mode-btn${mode==='notification'?' active':''}`} onClick={() => onModeChange('notification')}>
          Notify (~3s)
        </button>
      </div>
      <div className="btn-row">
        <button className="key-btn" onClick={onRetry}>Retry</button>
        <button className="key-btn primary" onClick={onSave}>Save tone</button>
      </div>
    </>
  );
}

// ── Stage: rendering ──────────────────────────────────────────────────────────
function RenderingStage({ mode, logs }) {
  return (
    <>
      <div className="lcd-title">RENDERING</div>
      <div className="lcd-sub">{mode === 'notification' ? '~3 seconds' : '~20 seconds'}</div>
      <div className="progress-track">
        <div className="progress-fill animating"/>
      </div>
      <Log lines={logs}/>
    </>
  );
}

// ── Stage: done ───────────────────────────────────────────────────────────────
function DoneStage({ downloadUrl, mode, onNew }) {
  return (
    <>
      <div className="done-header">DONE OK</div>
      <div className="lcd-sub">{mode === 'notification' ? 'notification tone' : 'ringtone'} ready</div>
      <audio controls src={downloadUrl}/>
      <div className="lcd-log" style={{marginBottom:10}}>
        <div>8-bit &middot; 8 khz &middot; mono</div>
        <div className="cursor">straight from 1999</div>
      </div>
      <div className="btn-row">
        <button className="key-btn" onClick={onNew}>New song</button>
        <a className="key-btn primary" href={downloadUrl} download={`nokify_${mode}.wav`}>
          Download
        </a>
      </div>
    </>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [stage, setStage]       = useState('idle');
  const [filename, setFilename] = useState('');
  const [logs, setLogs]         = useState([]);
  const [result, setResult]     = useState(null);
  const [mode, setMode]         = useState('ringtone');
  const [downloadUrl, setDownloadUrl] = useState('');

  const addLog = (text, err=false) => setLogs(p => [...p, {text, err}]);

  const reset = () => {
    setStage('idle'); setLogs([]); setResult(null);
    setDownloadUrl(''); setFilename(''); setMode('ringtone');
  };

  // ── upload from file
  const handleFile = async (file) => {
    setFilename(file.name);
    setStage('analyzing');
    setLogs([{text: 'decoding audio...'}]);
    setTimeout(() => addLog('computing chroma features...'), 900);
    setTimeout(() => addLog('building recurrence matrix...'), 2000);
    setTimeout(() => addLog('finding chorus...'), 3200);

    const fd = new FormData();
    fd.append('audio', file);
    try {
      const r = await fetch(`${API}/api/analyze`, {method:'POST', body: fd});
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Analyze failed');
      addLog('nokia-ify preview...');
      setTimeout(() => { setResult(data); setStage('review'); }, 400);
    } catch(e) {
      addLog(e.message, true);
    }
  };

  // ── imported from YouTube (already analyzed by backend)
  const handleImported = (data) => {
    setResult(data);
    setStage('review');
  };

  // ── render final tone
  const handleSave = async () => {
    setStage('rendering');
    setLogs([{text: `rendering ${mode}...`}]);
    setTimeout(() => addLog('applying low-pass filter...'), 500);
    setTimeout(() => addLog('resampling to 8 khz...'), 1000);
    setTimeout(() => addLog('bit-crushing to 8-bit...'), 1500);
    try {
      const r = await fetch(`${API}/api/render`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({job_id: result.job_id, mode}),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Render failed');
      setDownloadUrl(API + data.download_url);
      setStage('done');
    } catch(e) {
      addLog(e.message, true);
      setStage('review');
    }
  };

  return (
    <PhoneShell>
      {stage === 'idle'      && <IdleStage onFile={handleFile} onSearch={() => setStage('search')}/>}
      {stage === 'search'    && <SearchStage onBack={() => setStage('idle')} onImported={handleImported}/>}
      {stage === 'analyzing' && <AnalyzingStage label="ANALYZING" sublabel={filename} logs={logs}/>}
      {stage === 'review'    && result && (
        <ReviewStage result={result} mode={mode}
          onModeChange={setMode} onRetry={reset} onSave={handleSave}/>
      )}
      {stage === 'rendering' && <RenderingStage mode={mode} logs={logs}/>}
      {stage === 'done'      && <DoneStage downloadUrl={downloadUrl} mode={mode} onNew={reset}/>}
    </PhoneShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
